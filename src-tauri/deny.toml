# cargo-deny policy for OmniPacket. Run from src-tauri: cargo deny check
# CI runs the same check on every push and pull request.

[graph]
# Every shipping target, so platform-only crates are checked too.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]

[licenses]
# Permissive licenses only (CLAUDE.md). No GPL, LGPL or AGPL.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  # Unicode data and ICU4X crates (icu_*, zerovec, yoke, tinystr, ...),
  # pulled in by url/idna through Tauri. Permissive, OSI approved.
  "Unicode-3.0",
]
confidence-threshold = 0.93
exceptions = [
  # Mozilla CA root list as data. Permissive data license, attribution only.
  { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]

[licenses.private]
# Our own crate is unpublished; it is Apache-2.0 (see LICENSE).
ignore = true

[advisories]
# Fail on vulnerabilities and unsound crates; warn on unmaintained ones.
unmaintained = "workspace"
yanked = "deny"
ignore = [
  # rsa (via russh): Marvin timing attack on RSA private-key operations. No
  # fixed release exists. OmniPacket signs once per SSH login with the user's
  # own key and never decrypts with RSA, so remote timing is not observable at
  # scale. Recheck when rsa 0.10 final ships.
  { id = "RUSTSEC-2023-0071", reason = "no fix upstream; one signature per SSH login" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # Native C build (cmake, NASM on Windows). russh uses the ring backend.
  { crate = "aws-lc-sys", reason = "native build requirement; use ring" },
  { crate = "openssl-sys", reason = "native OpenSSL dependency; use rustls/ring" },
  # Npcap/libpcap: redistribution is not allowed in a paid product.
  { crate = "pcap", reason = "Npcap/libpcap license and dependency" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
