name: Release

# Push a tag like v0.1.0 to build installers for every OS and attach them to
# a draft GitHub release. Review the draft, then publish it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows x64
            os: windows-latest
            rust-targets: ""
            args: ""
          - name: Linux x64
            os: ubuntu-22.04
            rust-targets: ""
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libdbus-1-dev pkg-config xdg-utils

      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Release builds fetch the live IEEE OUI registry (no OUI_OFFLINE); the
      # build script falls back to the bundled seed set if the fetch fails.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Net3PO ${{ github.ref_name }}
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
          releaseBody: |
            Test build for the team. Builds are not code signed yet, so each OS warns once:

            **macOS** (`.dmg`, universal for Apple Silicon and Intel): open the DMG and drag Net3PO to Applications. The first launch is blocked as "unidentified developer": open System Settings > Privacy & Security, scroll down and click **Open Anyway**, then confirm.

            **Windows** (`-setup.exe` recommended, or `.msi`): SmartScreen may say "Windows protected your PC". Click **More info**, then **Run anyway**.

            **Linux**: `.deb` for Ubuntu and Debian (`sudo apt install ./Net3PO_*.deb`), `.rpm` for RHEL and Fedora (`sudo dnf install ./Net3PO-*.rpm`), or the `.AppImage` (`chmod +x` it and run).

            A few tools need extra privileges on some systems (for example Syslog or TFTP on their standard ports on Linux); the tool explains what it needs.

            Send feedback to Manny: what you tried, what you expected, what happened, and your OS.

            **Verify your download** (optional): compare against `SHA256SUMS.txt`.
            - macOS / Linux: `shasum -a 256 <file>` (or `sha256sum <file>`)
            - Windows PowerShell: `Get-FileHash <file> -Algorithm SHA256`

  checksums:
    name: Checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Add SHA256SUMS.txt to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --skip-existing
          rm -f SHA256SUMS.txt
          sha256sum $(ls | sort) > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber
